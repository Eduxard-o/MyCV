<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Habilidades
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-accordion-group>
    <ion-accordion *ngFor="let e of habilidades">
      <ion-item slot="header">
        <ion-label>{{ e.titulo }}</ion-label>
        <ion-badge slot="end">{{ e.anio }}</ion-badge>
      </ion-item>
      <div slot="content" class="ion-padding">{{ e.lugar }}</div>
    </ion-accordion>
  </ion-accordion-group>
</ion-content>
